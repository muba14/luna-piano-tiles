plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lunapiano.tiles'
    compileSdk 34

    defaultConfig {
        applicationId "com.lunapiano.tiles"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Oyunun kendisi deponun kökündeki www/ klasöründe; APK'ya asset olarak girer.
    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }
}
